<!DOCTYPE html>
<html>
<body>
    <form>
        <label for="userName"> Full name </label>
        <input type="text" id="userName" placeholder="e.g CodeChum Alano"><br>

        <label for="yearAndSection"> Year and Section </label>
        <select id="yearAndSection">
            <option value="">--Select Section--</option>
            <option value="Year 2 - CS1">2-CS1</option>
            <option value="Year 2 - CS2">2-CS2</option>
            <option value="Year 2 - CS3">2-CS3</option>
            <option value="Year 2 - CS3">2-CS4</option>
        </select><br>

        <label for="userAge"> Age: </label>
        <input type="number" id="userAge" placeholder="e.g 18" >
        <button type="button" onclick="checkAge()">Submit</button>
        
        <p id="outputResultName"></p>
        <p id="outputResultSection"></p>
        <p id="outputResultAge"></p>
    </form>

    <script>
        function checkAge(){
            const nameInput = document.getElementById("userName");
            const sectionSelect = document.getElementById("yearAndSection");
            const ageInput = document.getElementById("userAge");

            const outputName = document.getElementById("outputResultName");
            const outputSection = document.getElementById("outputResultSection");
            const outputAge = document.getElementById("outputResultAge");
            
            const userNameValue = nameInput.value;
            const sectionValue = sectionSelect.value;
            const ageValue = Number(ageInput.value);
            
         
            if (userNameValue === "") {
                outputName.textContent = "Please input your name";
            } else {
                outputName.textContent = "Name: " + userNameValue;
            }

        
            if (sectionValue === "") {
                outputSection.textContent = "Please select your Year and Section.";
            } else {
                outputSection.textContent = "Year and Section: " + sectionValue;
            }

          
            if (ageInput.value === "" || ageValue <= 0) { 
                outputAge.textContent = "Please input a valid number greater than 0.";
            } 
            else if (ageValue >= 18) {
                outputAge.textContent = "Access Granted: Adult Account. You are " + ageValue + " years old.";
            }
            else {
                outputAge.textContent = "Access Restricted: Minor Account. You are " + ageValue + " years old.";
            }
        }
    </script>
</body>
</html>
